<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://api.spicylyrics.org; script-src 'unsafe-inline'">
<title>Lyssna Lyrics request bridge</title>
<script data-cfasync="false">
(() => {
  const channel = "lyssna-lyrics-api-v1";
  const parentOrigin = "https://xpui.app.spotify.com";
  const pending = new Map();
  window.addEventListener("message", async event => {
    if (event.source !== window.parent || event.origin !== parentOrigin || event.data?.channel !== channel) return;
    const message = event.data;
    const reply = data => event.source.postMessage({ channel, id: message.id, ...data }, event.origin);
    if (message.type === "hello") {
      reply({ type: "ready" });
      return;
    }
    if (message.type === "cancel") {
      pending.get(message.id)?.abort();
      return;
    }
    if (message.type !== "lyrics" || typeof message.id !== "string" || message.id.length > 80
        || !/^[A-Za-z0-9]{22}$/.test(message.trackId) || !/^sl_pk_[A-Za-z0-9_-]+$/.test(message.key)) return;
    if (pending.has(message.id) || pending.size >= 4) {
      reply({ type: "response", status: 429, body: null, retryAfter: "1" });
      return;
    }
    const controller = new AbortController();
    pending.set(message.id, controller);
    const timer = setTimeout(() => controller.abort(), 15000);
    try {
      const response = await fetch(`https://api.spicylyrics.org/v1/lyrics/${message.trackId}`, {
        headers: { Authorization: `Bearer ${message.key}`, Accept: "application/json" },
        credentials: "omit",
        referrerPolicy: "no-referrer",
        signal: controller.signal,
      });
      const body = await response.json().catch(() => null);
      reply({ type: "response", status: response.status, body, retryAfter: response.headers.get("Retry-After") });
    } catch {
      reply({ type: "response", status: 502, body: null });
    } finally {
      clearTimeout(timer);
      pending.delete(message.id);
    }
  });
})();
</script>
</html>
